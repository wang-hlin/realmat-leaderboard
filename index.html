<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealMat-BaG leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <h1>RealMat-BaG leaderboard</h1>
    </section>

    <section class="tabs card">
      <div id="scenarioTabs" class="tabRow" aria-label="Scenario Tabs"></div>
      <div id="trainModeTabs" class="tabRow" aria-label="Training Mode Tabs"></div>
    </section>

    <section class="controls card">
      <div class="control">
        <label for="methodSearch">Method Search</label>
        <input id="methodSearch" type="text" placeholder="e.g. CGCNN" />
      </div>
      <div class="actions">
        <button id="resetBtn">Reset</button>
        <button id="downloadBtn">Download Current CSV</button>
      </div>
    </section>

    <section id="lomoHeatmapSection" class="card heatmapSection hidden">
      <div class="heatmapHeader">
        <h2>LOMO Category Heatmap (MRAE)</h2>
        <span id="lomoHeatmapLegend" class="heatmapLegend"></span>
      </div>
      <p class="lomoExplain">
        Leave-one-material-out (LOMO): materials are grouped by different categories. For each method, mean and std are computed across the 10 categories.
      </p>
      <div id="lomoHeatmapWrap" class="heatmapWrap"></div>
    </section>

    <section class="tableWrap card">
      <table id="leaderboard">
        <thead>
          <tr>
            <th>Rank</th>
            <th class="sortableTh" data-sort-key="method">
              <button
                id="showAllVizBtn"
                type="button"
                class="vizEyeBtn vizEyeResetBtn"
                title="Show all methods in visulisation"
                aria-label="Show all methods in visulisation"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M20 6v5h-5"></path>
                  <path d="M20 11a8 8 0 1 0 2 5.3"></path>
                </svg>
              </button>
              Method
            </th>
            <th class="sortableTh" data-sort-key="scenario">Scenario</th>
            <th class="sortableTh" data-sort-key="mode">Mode</th>
            <th class="sortableTh" data-sort-key="test_mrae_mean">MRAE (std)</th>
            <th class="sortableTh" data-sort-key="test_mae_mean">MAE (std)</th>
            <th class="sortableTh" data-sort-key="test_r2_mean">R<sup>2</sup> (std)</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section id="errorbarSection" class="card vizSection">
      <div class="vizHeader">
        <h2 class="vizTitle">
          <select id="metricSelect">
            <option value="mrae">MRAE</option>
            <option value="mae">MAE</option>
            <option value="r2">R²</option>
          </select>
          visulisation
        </h2>
        <span id="errorbarLegend" class="vizLegend"></span>
      </div>
      <div id="errorbarPlotWrap" class="vizPlotWrap"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
